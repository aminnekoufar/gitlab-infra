---
# آدرس‌ها را با محیط خودت عوض کن.
# اگر یک سرور بیشتر نداری: هر دو هاست را حذف کن و gitlab01 را در هر دو گروه بگذار.
all:
  vars:
    ansible_user: ansible              # کاربر sudo دار (NOPASSWD پیشنهاد می‌شود)
    ansible_become: true
    ansible_ssh_common_args: "-o StrictHostKeyChecking=no"

  children:
    gitlab:
      hosts:
        gitlab01:
          ansible_host: 10.10.10.11

    runners:
      hosts:
        runner01:
          ansible_host: 10.10.10.12
