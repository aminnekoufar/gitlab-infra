---
- name: Preflight | باندل آفلاین روی ماشین کنترل موجود است
  ansible.builtin.stat:
    path: "{{ offline_bundle_src }}"
  register: gitlab_bundle_stat
  delegate_to: localhost
  become: false
  check_mode: false

- name: Preflight | خطای نبود باندل
  ansible.builtin.fail:
    msg: >-
      باندل پیدا نشد: {{ offline_bundle_src }}
      روی ماشین دارای اینترنت اجرا کن:  ./offline/build-bundle.sh
      سپس tarball را کنار playbook بگذار (offline/dist/).
      اگر مخزن apt داخلی داری، لازم نیست: gitlab_pkg_source=mirror بگذار.
  when: not gitlab_bundle_stat.stat.exists

- name: مخزن فایلی | ایجاد دایرکتوری
  ansible.builtin.file:
    path: "{{ offline_repo_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: مخزن فایلی | استخراج باندل پکیج‌ها
  ansible.builtin.unarchive:
    src: "{{ offline_bundle_src }}"
    dest: "{{ offline_repo_dir }}"
    remote_src: false
    owner: root
    group: root
    creates: "{{ offline_repo_dir }}/Packages.gz"

- name: مخزن فایلی | افزودن سورس apt محلی
  ansible.builtin.copy:
    dest: "{{ gitlab_apt_sources_file }}"
    owner: root
    group: root
    mode: "0644"
    content: |
      # ساخته‌شده توسط Ansible (gitlab-infra) - مخزن آفلاین
      deb [trusted=yes] {{ offline_repo_uri }} ./

- name: مخزن فایلی | به‌روزرسانی کش apt
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 0
