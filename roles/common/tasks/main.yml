---
- name: Preflight | بررسی سیستم‌عامل
  ansible.builtin.assert:
    that:
      - ansible_distribution == 'Ubuntu'
      - ansible_distribution_major_version | int >= 22
    fail_msg: >-
      این role برای Ubuntu 22.04/24.04 نوشته شده است.
      تشخیص‌داده‌شده: {{ ansible_distribution }} {{ ansible_distribution_version }}
    quiet: true

- name: Apt | به‌روزرسانی کش از مخزن داخلی
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  when: common_update_cache
  register: common_apt_update
  failed_when: false
  changed_when: false

- name: Apt | هشدار در صورت شکست به‌روزرسانی کش
  ansible.builtin.debug:
    msg: >-
      ⚠️ apt update موفق نبود (rc={{ common_apt_update.rc }}).
      مطمئن شو /etc/apt/sources.list به آینهٔ داخلی اشاره می‌کند:
      {{ (common_apt_update.stderr | default('') | truncate(240)) }}
  when: common_update_cache and (common_apt_update.rc | default(0)) != 0

- name: نصب پکیج‌های پایه
  ansible.builtin.apt:
    name: "{{ common_packages }}"
    state: present
    update_cache: false

- name: Timezone | خواندن مقدار فعلی
  ansible.builtin.command: timedatectl show --property=Timezone --value
  register: common_tz_current
  changed_when: false
  check_mode: false

- name: Timezone | تنظیم منطقه زمانی
  ansible.builtin.command: "timedatectl set-timezone {{ timezone }}"
  when: common_tz_current.stdout | trim != timezone
  changed_when: true

- name: Chrony | فعال‌سازی سرویس
  ansible.builtin.systemd_service:
    name: chrony
    enabled: true
    state: started

- name: Chrony | سرورهای NTP داخلی
  ansible.builtin.copy:
    dest: /etc/chrony/conf.d/10-intra.conf
    mode: "0644"
    content: |
      # ساخته‌شده توسط Ansible (gitlab-infra)
      {% for server in common_ntp_servers %}
      pool {{ server }} iburst
      {% endfor %}
  when: common_ntp_servers | length > 0
  notify: restart chrony

- name: /etc/hosts | رکورد FQDN گیت‌لب
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '^\S+\s+{{ gitlab_fqdn }}(\s|$)'
    line: "{{ hostvars[groups['gitlab'][0]].ansible_host }} {{ gitlab_fqdn }}"
    state: present
  when:
    - common_manage_hosts_file
    - groups['gitlab'] is defined
    - groups['gitlab'] | length > 0

- name: Firewall | وضعیت فعلی ufw
  ansible.builtin.command: ufw status verbose
  register: common_ufw_status
  changed_when: false
  check_mode: false
  when: common_manage_firewall

- name: Firewall | قوانین ورودی مجاز
  ansible.builtin.shell: |
    set -o pipefail
    if ufw status | grep -qE '^{{ item }}(/tcp)?\s+ALLOW'; then
      echo "skip"
    else
      ufw allow {{ item }}/tcp
    fi
  register: common_ufw_rules
  changed_when: "'skip' not in common_ufw_rules.stdout"
  loop: >-
    {{ [common_firewall_ssh_port | string]
       + (['80', '443'] if inventory_hostname in (groups['gitlab'] | default([])) else []) }}
  when: common_manage_firewall

- name: Firewall | سیاست پیش‌فرض و فعال‌سازی
  ansible.builtin.command: "{{ item }}"
  loop:
    - ufw --force default deny incoming
    - ufw --force default allow outgoing
  changed_when: true
  when:
    - common_manage_firewall
    - "'Status: inactive' in common_ufw_status.stdout"

- name: Firewall | فعال‌سازی ufw
  ansible.builtin.command: ufw --force enable
  changed_when: true
  when:
    - common_manage_firewall
    - "'Status: inactive' in common_ufw_status.stdout"
